name: Fetch KONRAD3D and Convert to JSON

on:
  workflow_dispatch:

concurrency:
  group: fetch-konrad3d
  cancel-in-progress: false

env:
  R2_PREFIX: konrad3d

jobs:
  fetch_convert_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.VII_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set DATE und TIME (auf 5-min-Slot abrunden, UTC)
        run: |
          # 14:29 UTC -> Slot 14:25 UTC
          NOW=$(date -u +%s)
          SLOT_EPOCH=$(( NOW / 300 * 300 ))

          DATE=$(date -u -d "@$SLOT_EPOCH" +%Y%m%d)
          HHMM=$(date -u -d "@$SLOT_EPOCH" +%H%M)

          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "HHMM=$HHMM" >> $GITHUB_ENV
          echo "KONRAD_FILE=KONRAD3D_${DATE}T${HHMM}00.xml" >> $GITHUB_ENV
          echo "MESO_FILE=meso_${DATE}_${HHMM}.xml" >> $GITHUB_ENV

          echo "Slot UTC: ${DATE} ${HHMM}"
          echo "KONRAD: KONRAD3D_${DATE}T${HHMM}00.xml | MESO: meso_${DATE}_${HHMM}.xml"

      - name: Download KONRAD3D + Meso (mit Retry)
        run: |
          OUT_DIR="data/konrad3d"
          mkdir -p "$OUT_DIR"

          # Laedt eine Datei mit Retry. Rueckgabe 0 = ok, 1 = nicht verfuegbar
          fetch() {
            local label="$1" url="$2" out="$3" max="$4" sleep_s="$5"
            local tmp="${RUNNER_TEMP}/$(basename "$out")"
            local code
            for i in $(seq 1 "$max"); do
              code=$(curl -s -o "$tmp" -w "%{http_code}" \
                --connect-timeout 10 --max-time 120 "$url" || echo "000")
              if [ "$code" = "200" ] && [ -s "$tmp" ]; then
                mv "$tmp" "$out"
                echo "[$label] Erfolgreich (Versuch $i/$max): $out"
                return 0
              fi
              echo "[$label] Versuch $i/$max: noch nicht verfuegbar (HTTP $code)."
              rm -f "$tmp"
              sleep "$sleep_s"
            done
            return 1
          }

          # KONRAD3D: Pflicht
          if ! fetch "KONRAD3D" \
              "https://opendata.dwd.de/weather/radar/konrad3d/${KONRAD_FILE}" \
              "${OUT_DIR}/${KONRAD_FILE}" 50 5; then
            echo "::error::[KONRAD3D] ${KONRAD_FILE} nach 50 Versuchen nicht verfuegbar - Abbruch."
            exit 1
          fi

          # Meso: optional (weniger Versuche, Job laeuft bei Fehlschlag weiter)
          if ! fetch "MESO" \
              "https://opendata.dwd.de/weather/radar/mesocyclones/${MESO_FILE}" \
              "${OUT_DIR}/${MESO_FILE}" 12 5; then
            echo "::warning::[MESO] ${MESO_FILE} nicht verfuegbar - weiter ohne Meso."
          fi

      - name: XML nach JSON konvertieren
        run: |
          ARGS=(--konrad "data/konrad3d/${KONRAD_FILE}" --out output/konrad3d.json)
          if [ -s "data/konrad3d/${MESO_FILE}" ]; then
            ARGS+=(--meso "data/konrad3d/${MESO_FILE}")
          fi
          python scripts/konrad3d-to-json.py "${ARGS[@]}"

      - name: Upload JSON zu R2
        run: |
          aws s3 cp \
            output/konrad3d.json \
            "s3://${{ secrets.R2_BUCKET }}/${R2_PREFIX}/konrad3d.json" \
            --content-type application/json \
            --cache-control "public, max-age=60" \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto